<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Transparent Page</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
        }
        .panel {
            position: absolute;
            inset: 20px;
            border-radius: 12px;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            /*backdrop-filter: blur(10px);*/
        /*}*/
    </style>
</head>

<body>
<div class="panel">
     Transparent Page
</div>
</body>
</html>
